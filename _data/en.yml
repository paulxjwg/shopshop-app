benefits:
  title: Built for everyday shopping.
  together:
    title: Shared lists that stay in sync
    body: Share a grocery list through iCloud so everyone at home can add what’s missing.
  fast:
    title: Fast add
    body: Add groceries as you think of them.
  suggestions:
    title: Smart suggestions
    body: Let suggestions surface matching items, quantities, and sections.
  sections:
    title: Section-sorted shopping
    body: Set a different section order for each store to match the way you walk through it.
  repeat:
    title: Repeat shopping
    body: Recent and most-bought items stay easy to re-add, so the next list starts from what you already buy.
screens:
  title: Grocery lists for real life
  sharing:
    title: Share your list, shop faster
    image: /assets/screenshots/en-US/iphone-store-list.png
    alt: Weekly Shop is marked Shared by you, and Farmers Market is marked Shared with you.
    body: See which lists you share and which ones others share with you.
  fast:
    title: Add it before you forget it
    image: /assets/screenshots/en-US/iphone-fast-add.png
    alt: The add-item screen shows “2x Milk” and a matching suggestion labeled Dairy.
    body: Type “2x milk”. The suggestion includes the quantity and the Dairy section.
  sections:
    title: Match the list to your store
    image: /assets/screenshots/en-US/iphone-section-order.png
    alt: The Section Order screen with drag handles beside Produce, Dairy, Bakery, and Pantry.
    body: Pass the bakery before dairy? Drag Bakery above Dairy for this store.
  recent:
    title: Add your regulars again
    image: /assets/screenshots/en-US/iphone-recent-items.png
    alt: Purchase history with Chronological and Most Bought tabs and plus buttons beside previous purchases.
    body: Tap the plus beside a past purchase to put it back on your list.
