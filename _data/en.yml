privacy:
  title: Privacy Policy
  updated: Last updated
  intro: Shopshop does not collect user data or track its users in any way.
  analytics: provides aggregate usage statistics for apps distributed through the App Store. Your usage is included only if you agree to share analytics with app developers.
  storage: Shopshop uses Apple CloudKit to sync data between your Apple devices. Your data is stored in encrypted form in a private iCloud database. As developers, we have access to neither the data stored in your iCloud account nor your Apple ID. If you share content, the people you invite can view and edit it.
  deletion: You can delete the data this app stores in iCloud through the iCloud storage options in Settings. You can stop sharing in the app.
  apple_policy: "For more information, see Apple’s privacy policy:"
