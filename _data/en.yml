hero:
  title: Share lists.
  title_accent: Add fast.
  body: Shop from the same synced list, add groceries quickly, and organize each store in the order you actually walk it.
  explore: Take a closer look
  image: /assets/screenshots/en-US/iphone-article-list.png
  image_alt: An open Weekly Shop list with groceries grouped by section and quantities beside each item.
